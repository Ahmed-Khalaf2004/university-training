<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fly Landing Page</title>

    <link rel="stylesheet" href="../../../bootstrap/node_modules/bootstrap/dist/css/all.min.css">
    <link rel="stylesheet" href="../../../bootstrap/node_modules/bootstrap/dist/css/bondi.css">
    <link rel="stylesheet" href="../../../bootstrap/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet">
</head>

<body>

    <section class="landing">

        <nav class="navbar navbar-expand-lg">
            <div class="container">

                <a class="navbar-brand text-white" href="#">
                    Landing
                </a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="mainNavbar">
                    <ul class="navbar-nav ms-auto align-items-lg-center">

                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">Features</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">Reviews</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">Pricing</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">FAQ</a>
                        </li>

                        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                            <a class="btn btn-outline-light btn-sm rounded-pill px-3"
                               href="#">
                                Get Started
                            </a>
                        </li>

                    </ul>
                </div>

            </div>
        </nav>

        <div class="container hero-content justify-content-around">
            <div class=" row align-items-center justify-content-between">

                <div class="col-lg-5 text-white text-start">
                    <h1>
                        Fly makes you<br>
                        faster
                    </h1>

                    <p class="hero-description">
                        New free template by uicookies.com. For more
                        templates visit the site. Lorem ipsum dolor sit amet,
                        consectetur adipisicing elit.
                    </p>

                    <a href="#" class="btn btn-success rounded-pill px-4">
                        SEE PRICING
                    </a>
                </div>

                <div class="col-lg-6 offset-lg-1 mt-5 mt-lg-0 d-flex ">
                        <form class="signup-form bg-white p-4 shadow row align-items-center justify-content-between ">

                        <h3 class="text-center mb-3">
                            Sign up for Free
                        </h3>

                        <input class="form-control mb-2"
                               type="text"
                               placeholder="Full name">

                        <input class="form-control mb-2"
                               type="email"
                               placeholder="Email">

                        <input class="form-control mb-2"
                               type="email"
                               placeholder="Email">

                        <select class="form-select mb-2">
                            <option selected>Type</option>
                            <option value="1">Personal</option>
                            <option value="2">Business</option>
                        </select>

                        <button class="btn btn-primary rounded-pill w-100">
                            Register
                        </button>

                    </form>
                </div>

            </div>
        </div>

    </section>

    <script src="../../../bootstrap/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

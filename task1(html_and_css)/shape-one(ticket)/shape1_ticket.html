<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket ID</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">
        <header>
            <h1>Ticket ID: 409788</h1>
        </header>

        <div class="row">
            <span class="catagory">Name:</span>
            <div class="value">
                <div class="name">
                    <span class="cycle"></span>Parker Seidel
                </div>
                <div class="sub-text red">No Active Support</div>
            </div>
        </div>

        <div class="row">
            <span class="catagory">Email:</span>
            <span class="value yellow">seidel@aptmail.com</span>
        </div>

        <div class="row">
            <span class="catagory">Response Time:</span>
            <span class="value">72hours, 60hours left</span>
        </div>

        <div class="row">
            <span class="catagory">Last Action:</span>
            <span class="value">Never been locked.</span>
        </div>

        <div class="row link-row">
            <span class="catagory"></span>
            <span class="value">
                <a href="#" class="yellow">Link to public post</a>
            </span>
        </div>

        <div class="row">
            <span class="catagory">Status:</span>
            <span class="value orange">Not answered</span>
        </div>
    </main>

</body>

</html>

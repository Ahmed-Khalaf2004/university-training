<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Task</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Contact name</th>
                <th>City</th>
                <th>Country</th>
                <th>Is Promoted</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Maria Anders</td>
                <td>Berlin</td>
                <td>🇩🇪 Germany</td>
                <td><input type="checkbox"></td>
            </tr>
            <tr class="yellow">
                <td>Ana Trujillo</td>
                <td>México D.F.</td>
                <td>🇲🇽 Mexico</td>
                <td><input type="checkbox"></td>
            </tr>
            <tr>
                <td>Antonio Moreno</td>
                <td>México D.F.</td>
                <td>🇲🇽 Mexico</td>
                <td><input type="checkbox" checked></td>
            </tr>
            <tr class="yellow">
                <td>Thomas Hardy</td>
                <td>London</td>
                <td>🇬🇧 UK</td>
                <td><input type="checkbox"></td>
            </tr>
        </tbody>
    </table>

</body>

</html>
